<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    <linearGradient id="hwNightSky" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#0a0512"/>
      <stop offset="55%" stop-color="#190e28"/>
      <stop offset="100%" stop-color="#381710"/>
    </linearGradient>
    <radialGradient id="hwMoonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="35%" stop-color="#ffb347"/>
      <stop offset="70%" stop-color="#e65100" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hwPumpkinLight" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#ff9d3f"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
    <linearGradient id="hwJackFace" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="60%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="hwCardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Midnight Sky -->
  <rect width="320" height="120" fill="url(#hwNightSky)"/>

  <!-- Harvest Moon Atmosphere & Orb -->
  <circle cx="236" cy="42" r="38" fill="url(#hwMoonGlow)" opacity="0.65"/>
  <circle cx="236" cy="42" r="22" fill="#fff5cc" filter="url(#hwCardGlow)"/>

  <!-- Subtle Mist Horizon -->
  <ellipse cx="160" cy="98" rx="200" ry="24" fill="#ff6f00" opacity="0.14"/>

  <!-- Distant Moody Hill Silhouettes -->
  <path d="M0 86 Q60 70 140 82 T320 74 L320 120 L0 120 Z" fill="#140a1e" opacity="0.85"/>
  <path d="M0 98 Q80 84 180 94 T320 88 L320 120 L0 120 Z" fill="#0d0614"/>

  <!-- Flying Bats Silhouettes across Moon -->
  <path d="M198 32 C201 28 206 27 210 30 C213 27 218 28 221 32 C217 32 214 34 210 38 C207 34 202 32 198 32 Z" fill="#0d0614"/>
  <path d="M216 22 C218 19 222 18 225 20 C227 18 231 19 233 22 C230 22 228 23 225 26 C223 23 219 22 216 22 Z" fill="#0d0614"/>
  <path d="M176 46 C180 40 188 38 193 43 C198 39 205 40 209 46 C204 46 199 49 193 55 C189 49 181 46 176 46 Z" fill="#190e28"/>

  <!-- Sleek Jack-o'-Lantern in Foreground -->
  <g transform="translate(68, 72) scale(0.7)">
    <!-- Stem -->
    <path d="M38 14 C39 8 44 4 48 5 C47 9 44 13 41 16 Z" fill="#4e342e"/>
    <!-- Pumpkin Body -->
    <ellipse cx="40" cy="38" rx="34" ry="24" fill="url(#hwPumpkinLight)"/>
    <ellipse cx="40" cy="38" rx="25" ry="24" fill="#e65100" opacity="0.4"/>
    <!-- Glowing Eyes & Mouth -->
    <polygon points="25,32 33,35 27,40" fill="url(#hwJackFace)" filter="url(#hwCardGlow)"/>
    <polygon points="55,32 47,35 53,40" fill="url(#hwJackFace)" filter="url(#hwCardGlow)"/>
    <polygon points="40,36 37,41 43,41" fill="url(#hwJackFace)" filter="url(#hwCardGlow)"/>
    <path d="M24 45 C28 53 36 56 40 56 C44 56 52 53 56 45 C52 48 49 46 47 50 C44 46 42 47 40 50 C38 47 36 46 33 50 C30 46 27 48 24 45 Z" 
          fill="url(#hwJackFace)" filter="url(#hwCardGlow)"/>
  </g>

  <!-- Floating Warm Embers -->
  <circle cx="120" cy="85" r="1.4" fill="#ffd54f" opacity="0.8"/>
  <circle cx="145" cy="78" r="1.1" fill="#ffb74d" opacity="0.7"/>
  <circle cx="95" cy="65" r="1.6" fill="#ffe082" opacity="0.9" filter="url(#hwCardGlow)"/>
</svg>

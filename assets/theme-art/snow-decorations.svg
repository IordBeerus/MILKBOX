<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" fill="none">
  <defs>
    <!-- Ice Blue Gradient -->
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Frosted Glow Radial -->
    <radialGradient id="frostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hanging Frost Icicles from top -->
  <path d="M0 0 L15 35 L22 0 L38 55 L45 0 L65 40 L72 0 L95 65 L102 0 L130 45 L138 0 L160 50 L168 0 L200 70 L208 0 L235 40 L242 0 L270 58 L278 0 L310 42 L318 0 L350 68 L358 0 L390 48 L398 0 L430 60 L438 0 L470 38 L478 0 L500 45 L500 0 Z" fill="url(#iceGrad)" opacity="0.35"/>

  <!-- Large Detailed Snowflake Left -->
  <g transform="translate(110, 115)">
    <circle cx="0" cy="0" r="42" fill="url(#frostGlow)"/>
    <!-- Snowflake 6-fold symmetry -->
    <g stroke="url(#iceGrad)" stroke-width="2.2" stroke-linecap="round">
      <!-- 6 Main Arms -->
      <line x1="0" y1="-45" x2="0" y2="45"/>
      <line x1="-39" y1="-22.5" x2="39" y2="22.5"/>
      <line x1="-39" y1="22.5" x2="39" y2="-22.5"/>
      <!-- Chevrons / Branches -->
      <!-- Arm 1 & 4 (Vertical) -->
      <path d="M-8 -30 L0 -24 L8 -30 M-12 -16 L0 -8 L12 -16"/>
      <path d="M-8 30 L0 24 L8 30 M-12 16 L0 8 L12 16"/>
      <!-- Arm 2 & 5 -->
      <path d="M-22 -24 L-17 -14 L-9 -21 M-12 -12 L-9 -4 L-2 -9"/>
      <path d="M22 24 L17 14 L9 21 M12 12 L9 4 L2 9"/>
      <!-- Arm 3 & 6 -->
      <path d="M-22 24 L-17 14 L-9 21 M-12 12 L-9 4 L-2 9" transform="rotate(-120)"/>
      <path d="M22 -24 L17 -14 L9 -21 M12 -12 L9 -4 L2 -9" transform="rotate(-120)"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- Medium Snowflake Center-Right -->
  <g transform="translate(290, 130)">
    <circle cx="0" cy="0" r="32" fill="url(#frostGlow)"/>
    <g stroke="url(#iceGrad)" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="-32" x2="0" y2="32"/>
      <line x1="-27.7" y1="-16" x2="27.7" y2="16"/>
      <line x1="-27.7" y1="16" x2="27.7" y2="-16"/>
      <path d="M-6 -20 L0 -15 L6 -20 M-6 20 L0 15 L6 20"/>
      <path d="M-18 -10 L-13 -4 L-8 -10 M18 10 L13 4 L8 10"/>
      <path d="M-18 10 L-13 4 L-8 10 M18 -10 L13 -4 L8 -10" transform="rotate(-120)"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Small Snowflake Top Center -->
  <g transform="translate(200, 50)">
    <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-18" x2="0" y2="18"/>
      <line x1="-15.5" y1="-9" x2="15.5" y2="9"/>
      <line x1="-15.5" y1="9" x2="15.5" y2="-9"/>
      <path d="M-4 -11 L0 -8 L4 -11 M-4 11 L0 8 L4 11"/>
    </g>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>

  <!-- Small Snowflake Far Right -->
  <g transform="translate(430, 80)">
    <g stroke="url(#iceGrad)" stroke-width="1.6" stroke-linecap="round">
      <line x1="0" y1="-24" x2="0" y2="24"/>
      <line x1="-20.7" y1="-12" x2="20.7" y2="12"/>
      <line x1="-20.7" y1="12" x2="20.7" y2="-12"/>
      <path d="M-5 -15 L0 -11 L5 -15 M-5 15 L0 11 L5 15"/>
    </g>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Sparkling Ice Crystals & Diamonds -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Diamond 1 -->
    <path d="M50 70 L53 76 L59 79 L53 82 L50 88 L47 82 L41 79 L47 76 Z"/>
    <!-- Diamond 2 -->
    <path d="M370 45 L372 50 L377 52 L372 54 L370 59 L368 54 L363 52 L368 50 Z"/>
    <!-- Diamond 3 -->
    <path d="M475 140 L477 144 L482 146 L477 148 L475 152 L473 148 L468 146 L473 144 Z"/>
    <!-- Ice Dots -->
    <circle cx="30" cy="110" r="2"/><circle cx="170" cy="95" r="2.5"/><circle cx="230" cy="140" r="2"/><circle cx="350" cy="115" r="2.5"/><circle cx="485" cy="40" r="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Midnight Plum & Kyoto Twilight Base -->
    <radialGradient id="sakuraBase" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#190a18"/>
      <stop offset="45%" stop-color="#0e0510"/>
      <stop offset="100%" stop-color="#050207"/>
    </radialGradient>

    <!-- Glowing Rose Gold & Blossom Pink Haze Left -->
    <radialGradient id="blossomPink" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#db2777" stop-opacity="0.08"/>
      <stop offset="75%" stop-color="#9d174d" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0"/>
    </radialGradient>

    <!-- Spring Moonlight Pearl Glow Right -->
    <radialGradient id="moonlightGlow" cx="82%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#f43f5e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Magenta Ground Fog -->
    <radialGradient id="bottomSakura" cx="50%" cy="95%" r="65%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#e11d48" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4c0519" stop-opacity="0"/>
    </radialGradient>

    <!-- Cinematic Vignette -->
    <radialGradient id="sakuraVignette" cx="50%" cy="50%" r="65%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#040106" stop-opacity="0.88"/>
    </radialGradient>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1920" height="1080" fill="url(#sakuraBase)"/>
  <rect width="1920" height="1080" fill="url(#blossomPink)"/>
  <rect width="1920" height="1080" fill="url(#moonlightGlow)"/>
  <rect width="1920" height="1080" fill="url(#bottomSakura)"/>

  <!-- Distant Hill & Pagoda/Mountain Silhouettes -->
  <path d="M0 760 Q480 690 960 770 T1920 730 L1920 1080 L0 1080 Z" fill="#1b0b1c" opacity="0.45"/>
  <path d="M0 850 Q480 810 960 870 T1920 830 L1920 1080 L0 1080 Z" fill="#0d050f" opacity="0.65"/>

  <!-- Distant Floating Petal Silhouettes -->
  <g fill="#f472b6" opacity="0.55">
    <ellipse cx="220" cy="140" rx="4" ry="2" transform="rotate(35, 220, 140)"/>
    <ellipse cx="380" cy="90" rx="5" ry="2.5" transform="rotate(-25, 380, 90)"/>
    <ellipse cx="640" cy="180" rx="4.5" ry="2.2" transform="rotate(50, 640, 180)"/>
    <ellipse cx="890" cy="110" rx="4" ry="2" transform="rotate(15, 890, 110)"/>
    <ellipse cx="1140" cy="160" rx="5" ry="2.5" transform="rotate(-40, 1140, 160)"/>
    <ellipse cx="1420" cy="95" rx="4.2" ry="2.1" transform="rotate(30, 1420, 95)"/>
    <ellipse cx="1680" cy="150" rx="4.8" ry="2.4" transform="rotate(-15, 1680, 150)"/>
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="url(#sakuraVignette)"/>
</svg>

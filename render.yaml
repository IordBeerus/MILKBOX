services:
  - type: web
    name: milkbox
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: MANGADEX_ACCESS_TOKEN
        sync: false
services:
  - type: web
    name: milkbox
    runtime: node
    branch: main
    autoDeploy: true
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: MANGADEX_ACCESS_TOKEN
        sync: false
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Milkbox Player</title>
    <link rel="icon" type="image/png" href="/SiteIcon.png">
    <link rel="stylesheet" href="/milkbox-embed.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
    <div class="mb-player" id="mbPlayer">
        <div class="mb-stream-container" id="mbStreamContainer">
            <video id="mbNativeVideo" class="mb-native-video" playsinline preload="auto" style="display:none;"></video>
            <iframe id="mbStreamIframe" class="mb-stream-iframe" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media"></iframe>
            <div class="mb-click-overlay" id="mbClickOverlay"></div>
        </div>

        <button class="mb-center-play-btn" id="mbCenterPlayBtn" type="button" aria-label="Play video">
            <svg viewBox="0 0 24 24" fill="currentColor" width="34" height="34">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </button>

        <div class="mb-loader" id="mbLoader">
            <div class="mb-spinner"></div>
            <span class="mb-loader-text" id="mbLoaderText">Loading stream…</span>
        </div>

        <div class="mb-error-card" id="mbErrorCard" hidden>
            <div class="mb-error-icon">⚠️</div>
            <div class="mb-error-title" id="mbErrorTitle">Stream Failed to Load</div>
            <div class="mb-error-desc" id="mbErrorDesc">This source might be busy or unavailable. Try our alternate high-speed stream.</div>
            <div class="mb-error-actions">
                <button class="mb-btn mb-btn-pink" id="mbNextSourceBtn" type="button">Switch to Alternate Server</button>
                <button class="mb-btn mb-btn-ghost" id="mbRetryBtn" type="button">Retry Current Source</button>
            </div>
        </div>

        <div class="mb-upnext-card" id="mbUpNextCard" hidden>
            <div class="mb-upnext-tag">UP NEXT</div>
            <div class="mb-upnext-title" id="mbUpNextTitle">Next Episode</div>
            <div class="mb-upnext-timer">Starting in <span id="mbUpNextCountdown">5</span>s</div>
            <div class="mb-upnext-actions">
                <button class="mb-btn mb-btn-pink" id="mbUpNextPlayBtn" type="button">Play Now</button>
                <button class="mb-btn mb-btn-ghost" id="mbUpNextCancelBtn" type="button">Cancel</button>
            </div>
        </div>

        <header class="mb-top-bar" id="mbTopBar">
            <div class="mb-brand-pill">
                <span class="mb-brand-dot"></span>
                <span class="mb-brand-name">x8rr MOVIES</span>
                <span class="mb-brand-sub">HLS</span>
            </div>
            <div class="mb-media-info">
                <span class="mb-media-title" id="mbMediaTitle">Loading title…</span>
                <span class="mb-media-badge" id="mbMediaBadge"></span>
            </div>
            <div class="mb-top-actions">
                <div class="mb-server-badge" id="mbCurrentServerBadge" title="Current stream provider">
                    <span class="mb-server-icon">🍿</span>
                    <span id="mbCurrentServerLabel">x8rr Movies</span>
                </div>
            </div>
        </header>

        <div class="mb-controls-bar" id="mbControlsBar">
            <div class="mb-scrub-bar-wrap" id="mbScrubWrap">
                <div class="mb-scrub-bar">
                    <div class="mb-scrub-loaded" id="mbScrubLoaded"></div>
                    <div class="mb-scrub-progress" id="mbScrubProgress"></div>
                    <div class="mb-scrub-thumb" id="mbScrubThumb"></div>
                </div>
                <div class="mb-scrub-tooltip" id="mbScrubTooltip">0:00</div>
            </div>

            <div class="mb-controls-row">
                <div class="mb-controls-group">
                    <button class="mb-ctrl-btn mb-play-btn" id="mbPlayBtn" type="button" aria-label="Play/Pause" title="Play / Pause (Space)">
                        <svg class="mb-icon-play" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg class="mb-icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>

                    <button class="mb-ctrl-btn" id="mbSkipBackBtn" type="button" aria-label="Rewind 10 seconds" title="Rewind 10s (←)">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                            <text x="12" y="14.5" font-size="7" font-weight="900" fill="currentColor" text-anchor="middle">10</text>
                        </svg>
                    </button>

                    <button class="mb-ctrl-btn" id="mbSkipFwdBtn" type="button" aria-label="Fast forward 10 seconds" title="Forward 10s (→)">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
                            <text x="12" y="14.5" font-size="7" font-weight="900" fill="currentColor" text-anchor="middle">10</text>
                        </svg>
                    </button>

                    <button class="mb-ctrl-btn mb-ep-nav-btn" id="mbPrevEpBtn" type="button" title="Previous Episode" style="display:none;">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
                        </svg>
                    </button>

                    <button class="mb-ctrl-btn mb-ep-nav-btn" id="mbNextEpBtn" type="button" title="Next Episode (N)" style="display:none;">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>

                    <div class="mb-volume-wrap">
                        <button class="mb-ctrl-btn mb-vol-btn" id="mbVolBtn" type="button" aria-label="Mute/Unmute" title="Mute (M)">
                            <svg class="mb-vol-high" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                            </svg>
                            <svg class="mb-vol-muted" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>
                            </svg>
                        </button>
                        <input class="mb-vol-slider" id="mbVolSlider" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
                    </div>

                    <div class="mb-time-display" id="mbTimeDisplay">
                        <span class="mb-time-cur" id="mbTimeCur">0:00</span>
                        <span class="mb-time-sep">/</span>
                        <span class="mb-time-dur" id="mbTimeDur">0:00</span>
                    </div>
                </div>

                <div class="mb-controls-group mb-controls-right">
                    <button class="mb-ctrl-btn mb-text-btn" id="mbEpDrawerBtn" type="button" title="Episode Selector" style="display:none;">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                            <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                        </svg>
                        <span>Episodes</span>
                    </button>

                    <div class="mb-dropdown-wrap">
                        <button class="mb-ctrl-btn mb-text-btn" id="mbServerMenuBtn" type="button" title="Select Stream Source">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17">
                                <path d="M20 13H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1zM7 19c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM20 3H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1zM7 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                            </svg>
                            <span id="mbServerActiveLabel">Server</span>
                        </button>
                        <div class="mb-dropdown-menu" id="mbServerMenu" hidden>
                            <div class="mb-menu-header">Select Stream Provider</div>
                            <div class="mb-menu-list" id="mbServerList"></div>
                        </div>
                    </div>

                    <div class="mb-dropdown-wrap" id="mbQualityWrap" style="display:none;">
                        <button class="mb-ctrl-btn mb-text-btn" id="mbQualityBtn" type="button" title="Stream Quality">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17">
                                <path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.89-2-2-2zm0 14H5V6h14v12zM8 13h2.5v1.5H8V16h3.5v-4.5H8v1.5zm6-4.5H11v7h1.5v-2.5h1.5c.83 0 1.5-.67 1.5-1.5v-1.5c0-.83-.67-1.5-1.5-1.5zm0 3h-1.5V10H14v1.5z"/>
                            </svg>
                            <span id="mbQualityActiveLabel">Quality</span>
                        </button>
                        <div class="mb-dropdown-menu mb-menu-sm" id="mbQualityMenu" hidden>
                            <div class="mb-menu-header">Select Quality</div>
                            <div class="mb-menu-list" id="mbQualityList"></div>
                        </div>
                    </div>

                    <div class="mb-dropdown-wrap">
                        <button class="mb-ctrl-btn" id="mbSpeedBtn" type="button" title="Playback Speed">
                            <span class="mb-speed-badge" id="mbSpeedBadge">1x</span>
                        </button>
                        <div class="mb-dropdown-menu mb-menu-sm" id="mbSpeedMenu" hidden>
                            <div class="mb-menu-header">Playback Speed</div>
                            <div class="mb-menu-list">
                                <button class="mb-menu-item" data-speed="0.5">0.5x</button>
                                <button class="mb-menu-item" data-speed="0.75">0.75x</button>
                                <button class="mb-menu-item active" data-speed="1">1x Normal</button>
                                <button class="mb-menu-item" data-speed="1.25">1.25x</button>
                                <button class="mb-menu-item" data-speed="1.5">1.5x</button>
                                <button class="mb-menu-item" data-speed="2">2x</button>
                            </div>
                        </div>
                    </div>

                    <button class="mb-ctrl-btn" id="mbFullscreenBtn" type="button" aria-label="Fullscreen" title="Fullscreen (F)">
                        <svg class="mb-icon-fs-enter" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                        <svg class="mb-icon-fs-exit" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <aside class="mb-drawer" id="mbEpDrawer" hidden>
            <div class="mb-drawer-header">
                <div class="mb-drawer-title">
                    <span class="mb-drawer-accent"></span>
                    <span>Episodes</span>
                </div>
                <button class="mb-drawer-close" id="mbEpDrawerClose" type="button" aria-label="Close episodes">✕</button>
            </div>

            <div class="mb-season-select-wrap" id="mbSeasonSelectWrap" style="display:none;">
                <label for="mbSeasonSelect" class="mb-field-label">Season</label>
                <select id="mbSeasonSelect" class="mb-select"></select>
            </div>

            <div class="mb-ep-list" id="mbEpList">
                <div class="mb-drawer-loading">Loading episodes…</div>
            </div>
        </aside>
    </div>

    <script src="/milkbox-embed.js"></script>
</body>
</html>
